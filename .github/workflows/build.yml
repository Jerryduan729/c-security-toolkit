name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: 打包 ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 托管运行器在当前账号下不可用（任务 1 秒内被取消），
        # macOS arm64 版本改为在 Apple Silicon 本机执行 packaging/build.py 构建。
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-latest
            artifact: linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: 打包
        run: pyinstaller --noconfirm --clean packaging/security_toolkit.spec --distpath dist --workpath build

      - name: 冒烟测试
        shell: bash
        run: |
          ls -lh dist
          BIN=./dist/security-scan
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          "$BIN" --version
          "$BIN" --list-rules > rules.txt
          head -5 rules.txt
          set +e
          "$BIN" --authorized --source examples > scan.txt
          code=$?
          set -e
          echo "示例扫描退出码：$code（预期 1）"
          test "$code" -eq 1
          grep -q "SEC-101" scan.txt
          echo "中文输出与检出结果正常"

      - name: 打包成分发包
        shell: bash
        run: |
          VERSION=dev
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "版本：$VERSION"
          python packaging/package.py --version "$VERSION"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: security-toolkit-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.zip
            release/*.tar.gz
